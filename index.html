<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SEPTA Bus Routes Map</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
<style>
  body { margin: 0; padding: 0; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  // Mapbox public token
  mapboxgl.accessToken = 'pk.eyJ1IjoibWFyaW9ydXRhIiwiYSI6ImNtbmpqMDZhaDBwaTIyc29kbmt4eDJsNmYifQ.x_7uo4rulf71eC4BEJGymA';

  const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11'
  });

  map.on('load', () => {
      map.addSource('bus-routes', {
          type: 'vector',
          url: 'mapbox://marioruta.cs8c3ype'
      });

      map.addLayer({
          id: 'routes',
          type: 'line',
          source: 'bus-routes',
          'source-layer': 'route_shapes-d5ee5g',  // your real source layer
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#ff69b4', 'line-width': 2 }
      });

      // Zoom to the bounds of all features in the vector layer
      map.once('idle', () => {
          const features = map.querySourceFeatures('bus-routes', {
              sourceLayer: 'route_shapes-d5ee5g'
          });

          if (features.length) {
              const bounds = features.reduce((b, f) => {
                  return f.geometry.coordinates.reduce((bb, coord) => {
                      return bb.extend(coord);
                  }, b);
              }, new mapboxgl.LngLatBounds(features[0].geometry.coordinates[0], features[0].geometry.coordinates[0]));

              map.fitBounds(bounds, { padding: 20 });
          }
      });
  });
</script>
</body>
</html>
